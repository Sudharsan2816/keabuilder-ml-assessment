name: tests

on:
  push:
  pull_request:

jobs:
  similarity-search:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: demo1_similarity_search

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest test_app.py -q
